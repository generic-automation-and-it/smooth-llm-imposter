"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "./.conductor/scripts/setup.sh"
run_mode = "nonconcurrent"
# Per the Conductor schema, `auto_run_after_setup` only fires on new LOCAL
# workspaces. The cloud-restart recovery story relies on `default = true`
# making the run button prominent so a user can trigger it manually.
auto_run_after_setup = true

[scripts.run.restart-imposter]
command = "./.conductor/scripts/restart-imposter.sh"
default = true
icon = "refresh-cw"

[scripts.run.imposter-logs]
command = "./.conductor/scripts/imposter-logs.sh"
icon = "scroll-text"
