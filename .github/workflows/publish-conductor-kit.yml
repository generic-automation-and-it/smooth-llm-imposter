name: Publish conductor kit

# Builds the .conductor kit as a versioned tarball and attaches it to a GitHub
# Release: on a v* tag push, or via manual dispatch for a pre-release from any
# branch. Only a tag push is marked latest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Pre-release version tag (e.g. 1.0.0-rc.1). Must be a semver-compatible identifier without the leading "v".'
        required: true
        type: string

concurrency:
  group: publish-conductor-kit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Build & release kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          # Not a `pattern:` on the input — workflow_dispatch ignores that key.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$VERSION' is not semver (expected e.g. 1.2.3 or 1.0.0-rc.1, no leading v)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build kit tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          TARBALL="conductor-kit-${VERSION}.tar.gz"

          # Rooted at `.conductor/`; install.sh strips that prefix. Scripts ship
          # AS-IS, mappings included, so a consumer gets a working router.
          tar -czf "$TARBALL" \
            .conductor/scripts \
            .conductor/settings.toml \
            .conductor/AGENTS.md \
            .conductor/install.sh

          sha256sum "$TARBALL" > SHA256SUMS

          echo "Built $TARBALL ($(wc -c < "$TARBALL") bytes)"
          cat SHA256SUMS

      # The draft/publish split is mandatory: releases here are IMMUTABLE, so
      # assets attach only before publication. Publishing on create leaves a
      # permanently asset-less release behind — that burned v0.0.1 and v1.0.0.
      # Downstream note: a draft prerelease emits release.published.
      - name: Create draft release with assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.version.outputs.tag }}
          name: Conductor kit ${{ steps.version.outputs.tag }}
          # install.sh ships alongside the tarball, not only inside it — it is
          # the bootstrap, needed before the archive exists locally.
          files: |
            conductor-kit-${{ steps.version.outputs.version }}.tar.gz
            SHA256SUMS
            .conductor/install.sh
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          fail_on_unmatched_files: true

      # make_latest belongs here, not on the action: the action applies it at
      # creation, while the release is still a draft. install.sh with no --ref
      # resolves through /releases/latest, so something must claim it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          fi
          echo "Published $TAG with assets:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
